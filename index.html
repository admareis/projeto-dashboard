<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Desafios</title>
</head>
<body>
    <header>
        <h1>Painel de ferramentas</h1>
    </header>

    <div class="conteudo">

    <section>
        <button onclick="mostrarDesafio('d1')">Desafio 1</button>
        <button onclick="mostrarDesafio('d2')">Desafio 2</button>
        <button onclick="mostrarDesafio('d3')">Desafio 3</button>
        <button onclick="mostrarDesafio('d4')">Desafio 4</button>
        <button onclick="mostrarDesafio('d5')">Desafio 5</button>
        <button onclick="mostrarDesafio('d6')">Desafio 6</button>
    </section>    

    <div class="areaPrincipal">

    <div id="d1" class="painel">        
        <form action="">
        <h2>Conversor de moedas (BRL<=>USD)</h2>
        <label for="reais">Digite o valor em Reais</label>
        <input type="number" name="reais" id="reais" > 
        <label for="dolar">Digite o valor em Dólar</label>
        <input type="number" name="dolar" id="dolar" >
        <div class="buttons">
        <button type="button" onclick="converterMoedas()" class="calcular">Calcular</button>
        <button type="button" onclick="reset1()" class="limpar">Limpar</button>
        </div>
        <span id="calculoTotal1"></span>  
        </form>
    </div>

    <div id="d2" class="painel">       
        <form action="">
             <h2>Cálculo de IMC por Gênero</h2>
            <label for="peso">Digite o seu peso</label>
            <input type="number" name="peso" id="peso" step="0.01" placeholder="Ex: 60.5">
            <label for="altura">Digite a sua altura</label>
            <input type="number" name="altura" id="altura" step="0.01" placeholder="Ex: 1.70">
            <div>
                <label for="genero">Selecione o seu Gênero:</label>
                <select name="genero" id="genero">
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>            
            </div>
            <div class="buttons">
        <button type="button" onclick="calcularIMC()" class="calcular">Calcular IMC</button>
        <button type="button" onclick="reset2()" class="limpar">Limpar</button>
        </div>
        <span id="calculoTotal2"></span>
        </form>
        
    </div>

    <div id="d3" class="painel">
        <form action="">
        <h2>Conversor de Temperatura</h2>
        <label for="">Digite a temperatura em Celsius</label>
        <input type="number" name="Digite a temperatura em Celsius" id="celsius" > 
        <label for="">Digite a temperatura em Fahrenheit</label>
        <input type="number" name="Digite a tempetura em Fahrenheit" id="fahrenheit">
        <div class="buttons">
        <button type="button" onclick="calcularTemperatura()" class="calcular">Calcular</button>
        <button type="button" onclick="reset3()" class="limpar">Limpar</button>
        </div>
        <span id="calculoTotal3"></span>  
        </form>      
    </div>

    <div id="d4" class="painel">
        <form action="">
        <h2>Conversor de Velocidade</h2>
        <label for="">Digite a Velocidade em Quilômetros por hora(KM/h)</label>
        <input type="number" name="Digite a Velocidade em Km/h" id="km"> 
        <label for="">Digite a Velocidade em Milhas por hora (MP/h)</label>
        <input type="number" name="Digite a Velocidade em Mp/h" id="mp">
        <div class="buttons">
        <button type="button" onclick="converterVelocidade()" class="calcular">Calcular</button>
        <button type="button" onclick="reset4()" class="limpar">Limpar</button>
        </div>
        <span id="calculoTotal4"></span>
        </form>
    </div>

    <div id="d5" class="painel">
        <form action="">
        <h2>Conversor de Massa</h2>
        <label for="">Digite o valor da Massa em Quilograma (kg):</label>
        <input type="number" name="Digite o valor da Massa em Quilograma" id="kg"> 
        <label for="">Digite o valor da Massa em Libras (lb)</label>
        <input type="number" name="Digite o valor da Massa em Libras" id="lb">
        <div class="buttons">
        <button type="button" onclick="converterMassa()" class="calcular">Calcular</button>
        <button type="button" onclick="reset5()" class="limpar">Limpar</button>
        </div>
        <span id="calculoTotal5"></span>
        </form>
    </div>

    <div id="d6" class="painel">
        <form action="">
        <h2>Ferramenta de Regra de Três</h2>
        <p>Preencha os campos conforme a imagem de exemplo:</p>
        <div><img src="imagens/regradetres.png" alt="imagem de exemplo para cálculo de regra de três simples" ></div>
        <label for="campoA">Digite o valor A</label>
        <input type="number" name="campoA" id="campoA" placeholder="A">
        <label for="campoB">Digite o valor B</label>
        <input type="number" name="campoB" id="campoB" placeholder="B">
        <label for="campoC">Digite o valor C</label>
        <input type="number" name="campoC" id="campoC" placeholder="C">
        <label for="campoD">Este é resultado total de X:</label>
        <input type="text" id="campoX">
        <p id="erro"></p>
        <div class="buttons">
        <button type="button" onclick="CalcRegra3()" class="calcular">Calcular</button>
        <button type="button" onclick="reset6()" class="limpar">Limpar</button>
        </div>
    
    
    </form>
    </div>

    </div>

    </div>

    <footer><h1>Footer</h1></footer>
    
</body>
</html>
