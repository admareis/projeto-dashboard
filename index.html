<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Desafios</title>
</head>
<body>
    <header>
        <h1>Painel de ferramentas</h1>
    </header>

    <div class="conteudo">

    <section>
        <button onclick="mostrarDesafio('d1')">Desafio 1</button>
        <button onclick="mostrarDesafio('d2')">Desafio 2</button>
        <button onclick="mostrarDesafio('d3')">Desafio 3</button>
        <button onclick="mostrarDesafio('d4')">Desafio 4</button>
        <button onclick="mostrarDesafio('d5')">Desafio 5</button>
        <button onclick="mostrarDesafio('d6')">Desafio 6</button>
    </section>    

    <div class="areaPrincipal">

    <div id="d1" class="painel">
        <h2>Conversor de moedas</h2>
    </div>

    <div id="d2" class="painel">
        <h2>Cálculo de IMC por Gênero</h2>
    </div>

    <div id="d3" class="painel">
        <h2>Conversor de Temperatura</h2>
        <p>Digite a temperatura em Celsius</p>
        <input type="number" name="Digite a temperatura em Celsius" id="celsius" placeholder="ºC - utilize somente .(ponto)"> 
        <br>
        <p>Digite a temperatura em Fahrenheit</p>
        <input type="number" name="Digite a tempetura em Fahrenheit" id="fahrenheit" placeholder="ºF - utilize somente .(ponto)">
        <br>
        <button onclick="calcularTemperatura()">Calcular</button>
        <button onclick="reset()" >Limpar</button>
        <p id="calculoTotal"></p>
    </div>

    <div id="d4" class="painel">
        <h2>Conversor de Velocidade</h2>
    </div>

    <div id="d5" class="painel">
        <h2>Conversor de Massa</h2>
    </div>

    <div id="d6" class="painel">
        <h2>Ferramenta de Regra de Três</h2>
    </div>

    </div>

    </div>

    <footer><h1>Footer</h1></footer>
    
</body>
</html>
